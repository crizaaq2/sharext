name: sharext
description: "ShAre XT: share over Bluetooth, no internet."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  intl: any
  sx_core:
    path: ../packages/sx_core

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/branding/

  fonts:
    # Bundled because the app is offline: runtime font fetching is disabled
    # (SX-905). Bricolage Grotesque for display, Readex Pro for everything else.
    - family: Bricolage
      fonts:
        - asset: assets/fonts/BricolageGrotesque.ttf
    - family: Readex
      fonts:
        - asset: assets/fonts/ReadexPro.ttf

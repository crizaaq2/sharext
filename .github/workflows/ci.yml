name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    name: core analyze + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve
        working-directory: packages/sx_core
        run: dart pub get
      - name: Analyze
        working-directory: packages/sx_core
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/sx_core
        run: dart test

  android:
    name: Android APK
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve
        working-directory: app
        run: flutter pub get
      - name: Localize
        working-directory: app
        run: flutter gen-l10n
      - name: Analyze
        working-directory: app
        run: flutter analyze --fatal-infos
      - name: Test
        working-directory: app
        run: flutter test
      - name: Build universal APK
        working-directory: app
        run: flutter build apk --release --flavor prod
      - uses: actions/upload-artifact@v4
        with:
          name: sharext-apk-universal
          path: app/build/app/outputs/flutter-apk/*.apk
      - name: Build per-ABI APKs
        working-directory: app
        run: flutter build apk --release --flavor prod --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: sharext-apk-per-abi
          path: app/build/app/outputs/flutter-apk/*-release.apk

  windows:
    name: Windows EXE
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve
        working-directory: app
        run: flutter pub get
      - name: Localize
        working-directory: app
        run: flutter gen-l10n
      - name: Build
        working-directory: app
        run: flutter build windows --release
      - name: Package
        working-directory: app
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath ..\sharext-windows.zip -Force
      # Compiling is not the same as starting. Launch the packaged EXE from the
      # same folder the ZIP ships, and fail if it dies inside 12 seconds.
      - name: Smoke test the EXE
        working-directory: app
        shell: pwsh
        run: |
          $release = "build\windows\x64\runner\Release"
          if (-not (Test-Path "$release\sharext.exe")) { throw "sharext.exe was not produced" }
          $p = Start-Process -FilePath (Resolve-Path "$release\sharext.exe") -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "sharext.exe exited early (code $($p.ExitCode))" }
          "sharext.exe is running: pid $($p.Id), working set $([math]::Round($p.WorkingSet64 / 1MB, 1)) MB"
          Stop-Process -Id $p.Id -Force
      - uses: actions/upload-artifact@v4
        with:
          name: sharext-windows
          path: sharext-windows.zip

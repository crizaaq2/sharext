name: release

# Push a tag like v0.1.0 to publish a GitHub Release with the APKs and the
# Windows ZIP attached, so people can download straight from the Releases page.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  core:
    name: core tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: packages/sx_core
        run: dart pub get
      - working-directory: packages/sx_core
        run: dart analyze --fatal-infos
      - working-directory: packages/sx_core
        run: dart test

  android:
    name: Android APKs
    runs-on: ubuntu-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter gen-l10n
      - working-directory: app
        run: flutter analyze --fatal-infos
      - working-directory: app
        run: flutter test
      - name: Universal APK
        working-directory: app
        run: flutter build apk --release --flavor prod
      - name: Per-ABI APKs
        working-directory: app
        run: flutter build apk --release --flavor prod --split-per-abi
      - name: Collect with clear names
        run: |
          mkdir -p out
          cd app/build/app/outputs/flutter-apk
          cp app-prod-release.apk             "$GITHUB_WORKSPACE/out/sharext-${GITHUB_REF_NAME}-universal.apk"
          cp app-arm64-v8a-prod-release.apk   "$GITHUB_WORKSPACE/out/sharext-${GITHUB_REF_NAME}-arm64.apk"
          cp app-armeabi-v7a-prod-release.apk "$GITHUB_WORKSPACE/out/sharext-${GITHUB_REF_NAME}-arm32.apk"
          cd "$GITHUB_WORKSPACE/out" && sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: sharext-apk
          path: out/

  windows:
    name: Windows EXE
    runs-on: windows-latest
    needs: core
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter gen-l10n
      - working-directory: app
        run: flutter build windows --release
      - name: Package
        working-directory: app
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path ..\out | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath "..\out\sharext-${env:GITHUB_REF_NAME}-windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: sharext-windows
          path: out/

  publish:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [android, windows]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Flatten
        run: |
          mkdir -p release
          find assets -type f -exec cp {} release/ \;
          ls -lh release
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "ShAre XT $TAG" \
            --generate-notes \
            --notes "Sprint 0 test build. Bluetooth is not wired yet: messages stay queued and the chat says so. Windows: unzip and run sharext.exe (SmartScreen warns until the build is code-signed)."
